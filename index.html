<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
</head>
<body class="page">
    <header class="app-header" id="top-header">
        <h1 class="app-title">Task Manager</h1>

        <h3 class="form-heading">Add new task</h3>

        <form id="task-form" class="task-form">
            <label class="field-label" for="taskTitle">Task Title:</label>
            <input class="task-input" type="text" id="taskTitle" name="taskTitle" placeholder="Enter task title" required>
            <br><br>

            <label class="field-label" for="task-status">Status</label>
            <select id="task-status" class="task-status" name="status">
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>

            <button class="btn btn-primary" id="add-task-btn" type="submit">Add task</button>
        </form>
    </header>

    <main class="tasks-section" id="tasks-section">
        <h2 class="section-title">Tasks list</h2>
        <div class="filter-controls" id="filter-controls">
            <button class="filter-btn active" id="all-filter" type="button">All</button>
            <button class="filter-btn" id="pending-filter" type="button">pending</button>
            <button class="filter-btn" id="completed-filter" type="button">completed</button>
        </div>
    </main>
</body>
</html>
